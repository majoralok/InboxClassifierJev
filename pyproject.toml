[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-inbox-classifier"
version = "1.0.0"
description = "Self-hosted Gmail organizer powered by TypeSafe Jev and LangChain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4"
dependencies = [
  "cryptography>=46.0,<47",
  "fastapi>=0.118,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "jinja2>=3.1,<4",
  "langchain-typesafe==0.0.1a3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
exclude = ["tests"]
